<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Github</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

       
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: white;
            border-bottom: 2px solid #333;
            box-sizing: border-box;
            z-index: 1000; /* Agar tetap di atas konten lain */
        }

        .logo {
            font-weight: 800;
            letter-spacing: 1px;
            color: #6200ea;
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
            margin: 0;
            padding: 0;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #03dac6;
        }

        .container {
            text-align: center;
            background: white;
            padding: 2rem 3rem;
            border-radius: 15px;
            box-shadow: 10px 10px 0px #bebece;
            border: 2px solid #333;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #6200ea, #03dac6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            margin-top: 10px;
            color: #666;
            font-weight: 500;
        }
        .footer {
            position: fixed;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 10px 0;
            background: #eeeeff;
            border-top: 1px solid #333;
            font-size: 0.8rem;
        }

        .footer p {
            margin: 0;
            color: #777;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">GIT-LAB</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <h1>Marvelous Alarri Gad Learsi</h1>
        <p>Praktikum Git & GitHub</p>
    </div> 
    <footer class="footer">
        <p>&copy; 2026 Marvelous Alarri. Created for Database Systems Practice.</p>
    </footer>
</body>
</html>
