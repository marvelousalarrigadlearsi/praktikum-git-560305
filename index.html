<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Belajar Github</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .logo {
            font-weight: 800;
            letter-spacing: 1px;
            color: #6200ea;
        }


        .container {
            text-align: center;
            background: white;
            padding: 2rem 3rem;
            border-radius: 15px;
            box-shadow: 10px 10px 0px #bebece;
            border: 2px solid #333;
            transition: all 0.3s ease-in-out;
        }

        .container:hover {
            transform: translateY(-5px);
            box-shadow: 15px 15px 0px #6200ea;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(45deg, #6200ea, #03dac6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s ease-in-out;
        }

        h1:hover {
            background: linear-gradient(45deg, #03dac6, #6200ea);
            -webkit-background-clip: text;
            filter: drop-shadow(0px 0px 8px rgba(98, 0, 234, 0.3));
            cursor: pointer;
        }

        p {
            margin-top: 10px;
            color: #666;
            font-weight: 500;
        }

    </style>
</head>
<body>

    <di class="container">
        <h1>Marvelous Alarri Gad Learsi</h1>
        <p>Praktikum Git & GitHub</p>
    </di
</body>
</html>
